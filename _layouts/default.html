<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}" />
    <meta name="color-scheme" content="light dark" />
    <style>
      /* The app's colours: vellum by day, the night vigil in the dark. */
      :root {
        --bg: #f5efe2;
        --ink: #16213f;
        --muted: #596079;
        --flame: #8f5205;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a1124;
          --ink: #f2e9d7;
          --muted: #a3aac0;
          --flame: #f3b555;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 17px/1.55 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 24px 16px 64px;
      }
      nav {
        margin-bottom: 28px;
        font-size: 0.92em;
      }
      nav a + a {
        margin-left: 18px;
      }
      h1,
      h2 {
        font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
        font-weight: 600;
        line-height: 1.2;
      }
      h1 {
        font-size: 1.9em;
        margin: 0 0 6px;
      }
      h2 {
        font-size: 1.2em;
        margin: 28px 0 6px;
      }
      a {
        color: var(--flame);
      }
      em {
        color: var(--muted);
      }
      li + li {
        margin-top: 6px;
      }
      li::marker {
        color: var(--flame);
      }
    </style>
  </head>
  <body>
    <main>
      <nav><a href="{{ '/' | relative_url }}">Talking Back</a><a href="{{ '/privacy' | relative_url }}">Privacy policy</a></nav>
      {{ content }}
    </main>
  </body>
</html>
